# .coderabbit.yaml
# Конфигурация за CodeRabbit AI

language: "bg-BG" # Коментарите и резюметата ще бъдат на български език
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false # Изключваме стихотворенията в края на ревютата :)
  review_status: true
  collapse_walkthrough: false
  
  # Глобални инструкции към изкуствения интелект
  instructions: |
    - Преглеждай кода стриктно за изтичане на памет, performance проблеми и сигурност.
    - Проверявай за правилно използване на React hooks и Next.js App Router (сървърни/клиентски компоненти).
    - Бъди критичен към сложни и вложени (nested) структури - насърчавай изчистен и четим код (подобно на SonarJS).

  path_instructions:
    - path: "src/**/*.{js,jsx,ts,tsx}"
      instructions: |
        - Изисквай строги TypeScript типове (без 'any', ако е възможно).
        - Увери се, че компонентите са добре структурирани и преизползваеми.
