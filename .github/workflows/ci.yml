name: CI / CD & Security Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-quality:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Secret Detection (TruffleHog)
        uses: trufflesecurity/trufflehog@38999f88bed87fce0861ac313cbca06267b439c7 # main
        with:
          path: ./
          extra_args: --only-verified
        continue-on-error: true

      - name: Dependency Security Audit
        run: npm run security-check

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Code Quality
        run: npm run lint

      - name: Stylelint CSS Verification
        run: npm run lint:css

      - name: Circular Dependency Check
        run: npm run check:circular

      - name: Architectural Dependency Rules
        run: npm run check:deps

      - name: Duplicate Code Check
        run: npm run check:dup-code

  unit-and-security-tests:
    name: Vitest Unit & Multi-Tenancy Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npm test

  build-verification:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [security-and-quality, unit-and-security-tests]
    env:
      NEXT_PUBLIC_SITE_ID: "bkgalabovo"
      NEXT_PUBLIC_FIREBASE_API_KEY: "fake-api-key"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "bkgalabovo-test.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "bkgalabovo-test"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "bkgalabovo-test.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:test"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Production Bundle
        run: npm run build
