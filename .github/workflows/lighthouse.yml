name: Lighthouse CI Performance Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      limit:
        description: 'Брой страници за одит (напр. 20 или 100)'
        required: false
        default: '20'

jobs:
  lighthouse-audit:
    name: Lighthouse Audit (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout Repository
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Lighthouse Audit (Shard ${{ matrix.shard }}/4)
        # Passing required environment variables as secrets for the custom script
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "bkgalabovo2025"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
        run: node scripts/lighthouse-audit.js --shard=${{ matrix.shard }}/4 --limit=${{ inputs.limit || 20 }}

      - name: Upload Lighthouse Reports
        if: always()
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: lighthouse-reports-shard-${{ matrix.shard }}
          path: .lighthouse-reports/
          include-hidden-files: true
          retention-days: 30
