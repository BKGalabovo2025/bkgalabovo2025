name: Lighthouse CI Performance Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm install

      - name: Run Lighthouse Audit
        # Passing required environment variables as secrets for the custom script
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "bkgalabovo2025"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
        run: npm run lighthouse

      - name: Upload Lighthouse Reports
        if: always()
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: lighthouse-reports
          path: .lighthouse-reports/
          include-hidden-files: true
          retention-days: 30
