name: Firebase Rules Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-rules:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: fake-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: bkgalabovo-test.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: bkgalabovo-test
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: bkgalabovo-test.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:test"
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"
      FIREBASE_AUTH_EMULATOR_HOST: "127.0.0.1:9099"
      FIRESTORE_EMULATOR_HOST: "127.0.0.1:8081"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Java (Required for Firebase Emulator)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Dependencies
        run: npm ci

      - name: Run Firebase Rules Tests
        run: npm run test:rules

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
