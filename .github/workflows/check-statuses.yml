name: Check Member Statuses

on:
  schedule:
    # Всеки ден в 07:05 UTC (09:05 ч. зимно / 10:05 ч. лятно време в България)
    - cron: "5 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-statuses:
    name: Quota-Optimized Member Status Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install firebase-admin
        run: npm install --no-save firebase-admin@13.10.0

      - name: Run member status check
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_BACKUP_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_BACKUP_SERVICE_ACCOUNT_JSON }}
        run: node scripts/check-member-statuses.cjs
