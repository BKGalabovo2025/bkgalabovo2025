name: Vercel Deployments Cleanup

on:
  workflow_dispatch:

concurrency:
  group: vercel-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup Old Vercel Deployments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Check Vercel Token Availability
        id: check-token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::VERCEL_TOKEN secret is not set in GitHub Secrets. Add it to Settings -> Secrets and variables -> Actions to enable remote cleanup."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Wait for Vercel deployment to finish
        if: github.event_name == 'push' && steps.check-token.outputs.has_token == 'true'
        run: |
          echo "Waiting 2 minutes for Vercel production build to complete and become active..."
          sleep 120

      - name: Run Vercel Deployments Cleanup
        if: steps.check-token.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/cleanup-vercel-deployments.mjs

